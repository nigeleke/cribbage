services:
    postgres:
        image: postgres:latest
        container_name: postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: cribbage
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    cribbage:
        image: nigeleke/cribbage:latest
        container_name: cribbage
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/cribbage"
            RUST_LOG: info
            PORT: 8080
        ports:
            - "8080:8080"
        restart: unless-stopped

volumes:
    postgres-data:
