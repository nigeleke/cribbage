[package]
name = "server"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
cqrs-es = { git = "https://github.com/serverlesstechnology/cqrs.git" }
constants = { workspace = true }
futures = "0.3.31"
goofy-animals = "0.1.0"
itertools = "0.14.0"
postgres-es = { git = "https://github.com/serverlesstechnology/cqrs.git" }
rand = "0.9.2"
rand_chacha = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "runtime-async-std",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tracing = "0.1.43"
uuid = { version = "1.18.1", features = ["serde", "v4", "v7", "js"] }

[dev-dependencies]
insta = { version = "1.45.1", features = ["filters"] }
tracing-test = "0.2.5"

[features]
backtrace = []
