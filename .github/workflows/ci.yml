name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    docker:
        name: Start Docker services
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgres://postgres:password@localhost:5432/cribbage
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup containers
              shell: bash
              run: |
                  docker-compose -f docker/docker-compose up -d
                  cd packages/server
                  sqlx migrate run

    qa:
        uses: nigeleke/github/.github/workflows/dioxus-qa.yml@main
        with:
            platform: web
            DATABASE_URL: postgres://postgres:password@localhost:5432/cribbage

    bundle:
        needs: [qa]
        uses: nigeleke/github/.github/workflows/dioxus-bundle.yml@main
        with:
            platform: web
