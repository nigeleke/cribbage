[workspace]
resolver = "2"
# members = ["core", "ui", "web", "desktop", "mobile", "api"]
members = ["domain"]

[workspace.dependencies]
dioxus = { version = "0.6" }
thiserror = "2"
uuid = { version = "1.8", features = ["serde", "v4"] }
enum-iterator = "2.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
itertools = "0.13"
# dev-dependencies
pretty_assertions = "1.4"
insta = { version = "1.42", features = ["filters"] }
