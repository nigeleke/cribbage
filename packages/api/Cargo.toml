[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { workspace = true, features = ["fullstack"] }
axum = { version = "0.8.4" }
bb8-valkey = { version = "0.0.0-alpha2" }
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = { version = "1.0.145" }
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
thiserror = "2.0.16"
uuid = { version = "1.18.1", nodefault = true, features = ["v4", "v7", "serde"] }
tokio-valkey = { version = "0.0.0-alpha2", optional = true }
dto = { workspace = true }
strum = { version = "0.27.2", features = ["derive"] }
eventsourced = "0.27.0"
eventsourced_ext = { workspace = true }
itertools = "0.14.0"
eventsourced-postgres = "0.14.1"
rand = "0.9.2"

[dev-dependencies]
insta = { version = "1.43.2", features = ["filters"] }

[features]
default = []
server = [
    "dioxus/server",
    # "dep:bb8-valkey",
    # "dep:serde_json",
    # "dep:sqlx",
    "dep:tokio-valkey",
]
