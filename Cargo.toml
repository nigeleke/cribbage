[workspace]
resolver = "2"
members = [
    "packages/constants",
    "packages/ui",
    "packages/web",
    # "packages/desktop",
    # "packages/mobile",
    "packages/api",
    "packages/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3"

[workspace.dependencies]
dioxus = "0.7.1"
dioxus-sdk = "0.7.0"
api = { path = "packages/api" }
constants = { path = "packages/constants" }
server = { path = "packages/server" }
ui = { path = "packages/ui" }
