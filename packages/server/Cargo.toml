[package]
name = "server"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
constants = { workspace = true }
futures = "0.3"
goofy-animals = "0.1"
itertools = "0.15"
postgres-es = "0.5"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "runtime-async-std",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
strum = { version = "0.28", features = ["derive"] }
tellus = { version = "0.2.1", features = ["persistence"] }
tellus-persistence-postgres = "0.1.1"
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1.21", features = ["serde", "v4", "v7", "js"] }

[dev-dependencies]
insta = { version = "1.47", features = ["filters"] }
tracing-test = "0.2"

[features]
backtrace = []
